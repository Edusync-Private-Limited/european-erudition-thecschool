<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Sign-In - European Erudition Institutions TheCSchool</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
        <link rel="stylesheet" href="/css/main.css">
</head>
<body class="page-signin">
    <div class="portal-shell">
        <section class="signin-panel">
            <div class="logo-section">
                <div class="school-logo">
                    <i class="fas fa-graduation-cap"></i>
                </div>
                <h1>Admin Portal</h1>
                <p class="subtitle">European Erudition Institutions TheCSchool</p>
            </div>

            <div class="signed-in-banner" id="signedInBanner">
                <i class="fas fa-check-circle"></i> Signed in successfully. Choose a section on the right.
            </div>

            <form id="signinForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-container">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" placeholder="Enter your username" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-container">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="Enter your password" required>
                    </div>
                </div>

                <button type="submit" class="signin-btn" id="signinBtn">
                    <span id="btnText">Sign In</span>
                </button>

                <div class="loading" id="loading">
                    <div class="spinner"></div>
                </div>

                <div class="error-message" id="errorMessage">
                    Invalid credentials. Please try again.
                </div>
            </form>
        </section>

        <section class="admin-panel locked" id="adminPanel">
            <div class="admin-panel-header">
                <h2>Choose Admin Section</h2>
                <p>Select a module to manage school content and enquiries.</p>
            </div>

            <div class="lock-notice" id="lockNotice">
                <i class="fas fa-lock"></i>
                <span>Sign in on the left to unlock these admin sections.</span>
            </div>

            <div class="admin-options">
                <button type="button" class="option" onclick="redirectTo('activities')">
                    <i class="fas fa-calendar-alt"></i>
                    <span>Activities</span>
                </button>
                <button type="button" class="option" onclick="redirectTo('gallery')">
                    <i class="fas fa-images"></i>
                    <span>Gallery</span>
                </button>
                <button type="button" class="option" onclick="redirectTo('birthday')">
                    <i class="fas fa-birthday-cake"></i>
                    <span>Birthdays</span>
                </button>
                <button type="button" class="option" onclick="redirectTo('planner')">
                    <i class="fas fa-calendar-check"></i>
                    <span>Planner</span>
                </button>
                <button type="button" class="option" onclick="redirectTo('contact')">
                    <i class="fas fa-envelope"></i>
                    <span>Contact Messages</span>
                </button>
            </div>
        </section>
    </div>

    <script>
        const signinForm = document.getElementById('signinForm');
        const signinBtn = document.getElementById('signinBtn');
        const btnText = document.getElementById('btnText');
        const loading = document.getElementById('loading');
        const errorMessage = document.getElementById('errorMessage');
        const adminPanel = document.getElementById('adminPanel');
        const lockNotice = document.getElementById('lockNotice');
        const signedInBanner = document.getElementById('signedInBanner');

        signinForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            await signIn();
        });

        async function signIn() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (!username.trim() || !password.trim()) {
                showError('Please fill in all fields');
                return;
            }

            setLoadingState(true);
            hideError();

            try {
                const response = await fetch('/signin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });

                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('adminToken', data.token);
                    unlockAdminPanel();
                    signinBtn.innerHTML = '<i class="fas fa-check"></i> Signed In';
                    signinBtn.style.background = 'linear-gradient(135deg, #28a745, #20c997)';
                } else {
                    showError('Invalid credentials. Please try again.');
                }
            } catch (error) {
                console.error('Error:', error);
                showError('Connection error. Please try again.');
            } finally {
                setLoadingState(false);
            }
        }

        function unlockAdminPanel() {
            adminPanel.classList.remove('locked');
            lockNotice.classList.add('hidden');
            signedInBanner.classList.add('show');
        }

        function setLoadingState(isLoading) {
            signinBtn.disabled = isLoading;
            btnText.textContent = isLoading ? 'Signing In...' : 'Sign In';
            loading.classList.toggle('show', isLoading);
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            setTimeout(hideError, 5000);
        }

        function hideError() {
            errorMessage.classList.remove('show');
        }

        function redirectTo(page) {
            const token = localStorage.getItem('adminToken');
            if (!token) {
                showError('Please sign in first to access admin sections.');
                return;
            }

            const pages = {
                activities: `/admin-activities?token=${token}`,
                gallery: `/admin-gallery?token=${token}`,
                birthday: `/admin-birthday?token=${token}`,
                planner: `/admin-planner?token=${token}`,
                contact: `/admin-contact?token=${token}`
            };

            if (pages[page]) {
                window.location.href = pages[page];
            }
        }

        window.addEventListener('load', () => {
            if (localStorage.getItem('adminToken')) {
                unlockAdminPanel();
                signinBtn.innerHTML = '<i class="fas fa-check"></i> Signed In';
                signinBtn.style.background = 'linear-gradient(135deg, #28a745, #20c997)';
            }
        });
    </script>
</body>
</html>
