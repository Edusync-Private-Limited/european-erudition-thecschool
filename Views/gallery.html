<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
        <link rel="stylesheet" href="/css/main.css">
</head>
<body class="page-gallery">

    <!-- Navbar -->
    <nav class="navbar" id="navbar">
        <div class="navbar-header">
            <div class="logo">
                <a href="/home"><img src="images/dpslogo.jpeg" alt="School Logo"></a>
            </div>
            <button class="mobile-menu-toggle" onclick="toggleMobileMenu()">
                <div class="hamburger"></div>
                <div class="hamburger"></div>
                <div class="hamburger"></div>
            </button>
        </div>
        <ul class="nav-links" id="navLinks">
            <li><a href="/home">Home</a></li>
            <li><a href="/about">About Us</a></li>
            <li><a href="/admissions">Admissions</a></li>
            <li><a href="/academics">Academics</a></li>
            <li><a href="/hostel">Hostel</a></li>
            <li><a href="/activities">Activities</a></li>
            <li><a href="/birthday">Birthdays</a></li>
            <li><a href="/gallery" class="active">Gallery</a></li>
            <li><a href="/planner">Planner</a></li>
            <li><a href="/contactus">Contact Us</a></li>
            <li><a href="/Login">Login</a></li>
            <li><a href="/mandatory-disclosure">Disclosure</a></li>
        </ul>
    </nav>

    <!-- Gallery Section -->
    <div class="gallery-container">
        <h2>Gallery</h2>
        <div id="galleryList" class="gallery"></div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                const response = await fetch('/get-gallery');
                const data = await response.json();

                if (!Array.isArray(data) || data.length === 0) {
                    console.error("Invalid or empty gallery data:", data);
                    return;
                }

                const galleryList = document.getElementById('galleryList');
                galleryList.innerHTML = ""; // Clear existing content

                data.forEach(item => {
                    // Create a container for each gallery item
                    const galleryItem = document.createElement("div");
                    galleryItem.classList.add("gallery-item");

                    // Add the title
                    const title = document.createElement("h3");
                    title.textContent = item.title;
                    galleryItem.appendChild(title);

                    // Create a container for the images
                    const imagesContainer = document.createElement("div");
                    imagesContainer.classList.add("images");

                    // Add all images
                    item.images.forEach(imgSrc => {
                        const img = document.createElement("img");
                        img.src = imgSrc;
                        img.alt = item.title;
                        img.loading = "lazy"; // Improve performance with lazy loading
                        imagesContainer.appendChild(img);
                    });

                    galleryItem.appendChild(imagesContainer);
                    galleryList.appendChild(galleryItem);
                });

            } catch (error) {
                console.error('Error fetching gallery:', error);
            }
        });

        // Navbar scroll effect
        window.addEventListener('scroll', () => {
            const navbar = document.getElementById('navbar');
            if (window.scrollY > 30) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });

        // Mobile menu toggle function
        function toggleMobileMenu() {
            const navLinks = document.getElementById('navLinks');
            const mobileToggle = document.querySelector('.mobile-menu-toggle');
            navLinks.classList.toggle('active');
            mobileToggle.classList.toggle('active');
        }

        // Close mobile menu when clicking on a link
        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                document.getElementById('navLinks').classList.remove('active');
                document.querySelector('.mobile-menu-toggle').classList.remove('active');
            });
        });
    </script>

</body>
</html>
