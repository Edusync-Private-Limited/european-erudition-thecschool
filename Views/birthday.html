<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday</title>
        <link rel="stylesheet" href="/css/main.css">
</head>
<body class="page-birthday">
    <!-- Navbar -->
    <nav class="navbar" id="navbar">
        <div class="navbar-header">
            <div class="logo">
                <img src="images/dpslogo.jpeg" alt="School Logo">
            </div>
            <button class="mobile-menu-toggle" onclick="toggleMobileMenu()">
                <div class="hamburger"></div>
                <div class="hamburger"></div>
                <div class="hamburger"></div>
            </button>
        </div>
        <ul class="nav-links" id="navLinks">
            <li><a href="/home">Home</a></li>
            <li><a href="/about">About Us</a></li>
            <li><a href="/admissions">Admissions</a></li>
            <li><a href="/academics">Academics</a></li>
            <li><a href="/hostel">Hostel</a></li>
            <li><a href="/activities">Activities</a></li>
            <li><a href="/birthday" class="active">Birthdays</a></li>
            <li><a href="/gallery">Gallery</a></li>
            <li><a href="/planner">Planner</a></li>
            <li><a href="/contactus">Contact Us</a></li>
            <li><a href="/Login">Login</a></li>
            <li><a href="/mandatory-disclosure">Disclosure</a></li>
        </ul>
    </nav>

    <!-- Birthday Section -->
    <div class="birthday-container">
        <h2>Birthdays</h2>
        <div id="birthdayList"></div>
    </div>

    <!-- Confetti Animation -->
    <div class="confetti" id="confetti"></div>

    <script>
        // Fetch birthdays from the server
        fetch('/get-birthdays')
            .then(response => response.json())
            .then(data => {
                const birthdayList = document.getElementById('birthdayList');
                birthdayList.innerHTML = data.map(birthday => `
                    <div class="birthday-item">
                        <img src="${birthday.image}" alt="${birthday.name}">
                        <div class="birthday-text">
                            <h3>${birthday.name}</h3>
                            <p>${birthday.date}</p>
                        </div>
                    </div>
                `).join('');
            })
            .catch(error => console.error('Error:', error));

        // Confetti Animation
        const confettiContainer = document.getElementById('confetti');
        const colors = ['#ffcc00', '#ff6699', '#66ccff', '#99ff66']; // Confetti colors

        for (let i = 0; i < 100; i++) {
            const confetti = document.createElement('div');
            confetti.classList.add('confetti-piece');
            confetti.style.left = `${Math.random() * 100}vw`;
            confetti.style.animationDuration = `${Math.random() * 3 + 2}s`;
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confettiContainer.appendChild(confetti);
        }

        // Navbar scroll effect
        window.addEventListener('scroll', () => {
            const navbar = document.getElementById('navbar');
            if (window.scrollY > 30) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });

        // Mobile menu toggle function
        function toggleMobileMenu() {
            const navLinks = document.getElementById('navLinks');
            const mobileToggle = document.querySelector('.mobile-menu-toggle');
            navLinks.classList.toggle('active');
            mobileToggle.classList.toggle('active');
        }

        // Close mobile menu when clicking on a link
        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                document.getElementById('navLinks').classList.remove('active');
                document.querySelector('.mobile-menu-toggle').classList.remove('active');
            });
        });
    </script>
</body>
</html>
