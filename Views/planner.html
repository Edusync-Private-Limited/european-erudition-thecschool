<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planner</title>
        <link rel="stylesheet" href="/css/main.css">
</head>
<body class="page-planner">

    <!-- Navbar -->
    <nav class="navbar" id="navbar">
        <div class="navbar-header">
            <div class="logo">
                <a href="/home"><img src="images/dpslogo.jpeg" alt="School Logo"></a>
            </div>
            <button class="mobile-menu-toggle" onclick="toggleMobileMenu()">
                <div class="hamburger"></div>
                <div class="hamburger"></div>
                <div class="hamburger"></div>
            </button>
        </div>
        <ul class="nav-links" id="navLinks">
            <li><a href="/home">Home</a></li>
            <li><a href="/about">About Us</a></li>
            <li><a href="/admissions">Admissions</a></li>
            <li><a href="/academics">Academics</a></li>
            <li><a href="/hostel">Hostel</a></li>
            <li><a href="/activities">Activities</a></li>
            <li><a href="/birthday">Birthdays</a></li>
            <li><a href="/gallery">Gallery</a></li>
            <li><a href="/planner" class="active">Planner</a></li>
            <li><a href="/contactus">Contact Us</a></li>
            <li><a href="/Login">Login</a></li>
            <li><a href="/mandatory-disclosure">Disclosure</a></li>
        </ul>
    </nav>

    <!-- Planner Section -->
    <div class="planner-container">
        <h2>Planner</h2>
        <div id="plannerList" class="planner"></div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                // FIXED: Changed from '/get-gallery' to '/get-planner'
                const response = await fetch('/get-planner');
                const data = await response.json();

                if (!Array.isArray(data) || data.length === 0) {
                    console.log("No planner data available");
                    document.getElementById('plannerList').innerHTML = '<div class="no-data">No planner items available</div>';
                    return;
                }

                // FIXED: Changed from 'galleryList' to 'plannerList'
                const plannerList = document.getElementById('plannerList');
                plannerList.innerHTML = ""; // Clear existing content

                data.forEach(item => {
                    // Create a container for each planner item
                    const plannerItem = document.createElement("div");
                    plannerItem.classList.add("planner-item");

                    // Add the title (page number)
                    const title = document.createElement("h3");
                    title.textContent = `${item.title}`;
                    plannerItem.appendChild(title);

                    // Create a container for the PDFs
                    const pdfContainer = document.createElement("div");
                    pdfContainer.classList.add("pdf-container");

                    // FIXED: Changed from 'images' to 'pdfs'
                    if (item.pdfs && item.pdfs.length > 0) {
                        item.pdfs.forEach((pdfUrl, index) => {
                            const pdfLink = document.createElement("a");
                            pdfLink.href = pdfUrl;
                            pdfLink.target = "_blank";
                            pdfLink.classList.add("pdf-item");

                            // Create PDF icon
                            const pdfIcon = document.createElement("div");
                            pdfIcon.innerHTML = `
                                <svg class="pdf-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M14 2H6C4.9 2 4 2.9 4 4V20C4 21.1 4.9 22 6 22H18C19.1 22 20 21.1 20 20V8L14 2Z" fill="#ff4444"/>
                                    <path d="M14 2V8H20" fill="#cc0000"/>
                                    <text x="12" y="16" text-anchor="middle" font-size="6" fill="white">PDF</text>
                                </svg>
                            `;

                            // Create PDF label
                            const pdfLabel = document.createElement("div");
                            pdfLabel.classList.add("pdf-label");
                            pdfLabel.textContent = `PDF ${index + 1}`;

                            pdfLink.appendChild(pdfIcon);
                            pdfLink.appendChild(pdfLabel);
                            pdfContainer.appendChild(pdfLink);
                        });
                    } else {
                        pdfContainer.innerHTML = '<div class="no-data">No PDFs available for this page</div>';
                    }

                    plannerItem.appendChild(pdfContainer);
                    plannerList.appendChild(plannerItem);
                });

            } catch (error) {
                console.error('Error fetching planner data:', error);
                document.getElementById('plannerList').innerHTML = '<div class="no-data">Error loading planner data</div>';
            }
        });
        // Navbar scroll effect
        window.addEventListener('scroll', () => {
            const navbar = document.getElementById('navbar');
            if (window.scrollY > 30) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });

        // Mobile menu toggle function
        function toggleMobileMenu() {
            const navLinks = document.getElementById('navLinks');
            const mobileToggle = document.querySelector('.mobile-menu-toggle');
            navLinks.classList.toggle('active');
            mobileToggle.classList.toggle('active');
        }

        // Close mobile menu when clicking on a link
        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                document.getElementById('navLinks').classList.remove('active');
                document.querySelector('.mobile-menu-toggle').classList.remove('active');
            });
        });
    </script>

</body>
</html>
