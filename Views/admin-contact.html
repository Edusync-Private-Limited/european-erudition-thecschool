<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Contact Messages</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
            margin: 0;
        }

        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .page-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .page-header h2 {
            margin: 0;
            color: #0e3970;
        }

        .page-header p {
            margin: 4px 0 0;
            color: #666;
            font-size: 14px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .toolbar input {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            min-width: 220px;
        }

        .toolbar button {
            padding: 8px 16px;
            background-color: #0e3970;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .toolbar button:hover {
            background-color: #75e5e9;
            color: #0e3970;
        }

        .toolbar button.export-btn {
            background-color: #198754;
        }

        .toolbar button.export-btn:hover {
            background-color: #157347;
            color: #fff;
        }

        .stats {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: #f8f9fa;
            border: 1px solid #e3e3e3;
            border-radius: 8px;
            padding: 14px 18px;
            min-width: 140px;
        }

        .stat-card span {
            display: block;
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .stat-card strong {
            font-size: 24px;
            color: #0e3970;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e3e3e3;
            vertical-align: top;
        }

        th {
            background: #0e3970;
            color: white;
            font-weight: 600;
            white-space: nowrap;
        }

        tr:hover {
            background: #f8fbff;
        }

        .reason-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 999px;
            background: #e8f4ff;
            color: #0e3970;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .message-cell {
            max-width: 280px;
            white-space: pre-wrap;
            word-break: break-word;
            color: #333;
        }

        .contact-link {
            color: #0e3970;
            text-decoration: none;
        }

        .contact-link:hover {
            text-decoration: underline;
        }

        .delete-btn {
            padding: 6px 12px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        .delete-btn:hover {
            background: #b02a37;
        }

        .empty-state, .error-state, .loading-state {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }

        .empty-state i, .error-state i {
            font-size: 40px;
            margin-bottom: 12px;
            color: #0e3970;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .dashboard-container {
                padding: 16px;
            }

            .toolbar input {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="page-header">
            <div>
                <h2>Contact Messages</h2>
                <p>Submissions from the public contact form</p>
            </div>
            <div class="toolbar">
                <input type="search" id="searchInput" placeholder="Search name, email, phone, reason...">
                <button type="button" id="exportBtn" class="export-btn"><i class="fas fa-file-excel"></i> Download Excel</button>
                <button type="button" id="refreshBtn"><i class="fas fa-sync-alt"></i> Refresh</button>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <span>Total</span>
                <strong id="totalCount">0</strong>
            </div>
            <div class="stat-card">
                <span>Showing</span>
                <strong id="visibleCount">0</strong>
            </div>
        </div>

        <div class="table-wrap">
            <div id="messagesContainer" class="loading-state">Loading messages...</div>
        </div>
    </div>

    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script>
        const token = new URLSearchParams(window.location.search).get('token');
        let allMessages = [];

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text ?? '';
            return div.innerHTML;
        }

        function formatDate(value) {
            if (!value) return '-';
            return new Date(value).toLocaleString('en-IN', {
                day: '2-digit',
                month: 'short',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function getFilteredMessages() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            if (!query) return allMessages;

            return allMessages.filter(row => {
                const haystack = [
                    row.full_name,
                    row.email,
                    row.phone,
                    row.reason,
                    row.message
                ].join(' ').toLowerCase();
                return haystack.includes(query);
            });
        }

        function renderTable(messages) {
            const container = document.getElementById('messagesContainer');
            document.getElementById('totalCount').textContent = allMessages.length;
            document.getElementById('visibleCount').textContent = messages.length;

            if (!messages.length) {
                container.className = 'empty-state';
                container.innerHTML = allMessages.length
                    ? '<i class="fas fa-search"></i><p>No messages match your search.</p>'
                    : '<i class="fas fa-inbox"></i><p>No contact messages yet.</p>';
                return;
            }

            container.className = '';
            container.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Reason</th>
                            <th>Message</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${messages.map(row => `
                            <tr>
                                <td>${escapeHtml(formatDate(row.created_at))}</td>
                                <td>${escapeHtml(row.full_name)}</td>
                                <td><a class="contact-link" href="mailto:${escapeHtml(row.email)}">${escapeHtml(row.email)}</a></td>
                                <td><a class="contact-link" href="tel:${escapeHtml(row.phone)}">${escapeHtml(row.phone)}</a></td>
                                <td><span class="reason-badge">${escapeHtml(row.reason)}</span></td>
                                <td class="message-cell">${escapeHtml(row.message)}</td>
                                <td><button class="delete-btn" onclick="deleteMessage(${row.id})">Delete</button></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        function filterMessages() {
            renderTable(getFilteredMessages());
        }

        function downloadExcel() {
            const rows = getFilteredMessages();
            if (!rows.length) {
                alert('No messages to export.');
                return;
            }

            const sheetData = rows.map(row => ({
                Date: formatDate(row.created_at),
                Name: row.full_name,
                Email: row.email,
                Phone: row.phone,
                Reason: row.reason,
                Message: row.message
            }));

            const worksheet = XLSX.utils.json_to_sheet(sheetData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, 'Contact Messages');

            worksheet['!cols'] = [
                { wch: 20 },
                { wch: 22 },
                { wch: 28 },
                { wch: 16 },
                { wch: 18 },
                { wch: 40 }
            ];

            const fileName = `contact-messages-${new Date().toISOString().slice(0, 10)}.xlsx`;
            XLSX.writeFile(workbook, fileName);
        }

        async function loadMessages() {
            const container = document.getElementById('messagesContainer');
            container.className = 'loading-state';
            container.textContent = 'Loading messages...';

            try {
                const response = await fetch('/get-contact-messages', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.status === 401) {
                    alert('Session expired. Please sign in again.');
                    window.location.href = '/signin';
                    return;
                }

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.message || 'Failed to load messages');
                }

                allMessages = data;
                filterMessages();
            } catch (error) {
                container.className = 'error-state';
                container.innerHTML = `<i class="fas fa-exclamation-triangle"></i><p>${escapeHtml(error.message)}</p>`;
            }
        }

        async function deleteMessage(id) {
            if (!confirm('Delete this contact message?')) {
                return;
            }

            try {
                const response = await fetch('/delete-contact-message', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ id })
                });

                const data = await response.json();
                if (!response.ok || !data.success) {
                    throw new Error(data.message || 'Failed to delete message');
                }

                allMessages = allMessages.filter(row => row.id !== id);
                filterMessages();
            } catch (error) {
                alert(error.message);
            }
        }

        document.getElementById('refreshBtn').addEventListener('click', loadMessages);
        document.getElementById('exportBtn').addEventListener('click', downloadExcel);
        document.getElementById('searchInput').addEventListener('input', filterMessages);

        if (!token) {
            alert('Unauthorized! Please sign in again.');
            window.location.href = '/signin';
        } else {
            loadMessages();
        }
    </script>
</body>
</html>
