<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
        <link rel="stylesheet" href="/css/main.css">
</head>
<body class="page-dashboard">
    <div class="dashboard-container">
        <div class="option-card" onclick="redirectTo('admin-activities')">
            <img src="activities.jpg" alt="Admin Activities">
            <h3>Admin Activities</h3>
        </div>
        <div class="option-card" onclick="redirectTo('admin-staff')">
            <img src="staff.jpg" alt="Admin Staff">
            <h3>Admin Staff</h3>
        </div>
    </div>

    <script>
        function redirectTo(page) {
            const token = localStorage.getItem('adminToken');
            if (!token) {
                alert('Unauthorized! Please sign in again.');
                window.location.href = '/';
                return;
            }
            window.location.href = `/${page}?token=${token}`;
        }
    </script>
</body>
</html>
